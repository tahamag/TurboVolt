<mat-toolbar color="primary" class="app-header">
    <button mat-icon-button (click)="toggleSidenav.emit()" aria-label="Toggle Menu">
        <mat-icon>menu</mat-icon>
    </button>

    <div class="brand">
        <mat-icon class="brand-icon">bolt</mat-icon>
        <span class="brand-title">TurboVolt </span>
    </div>

    <span class="spacer"></span>

    <div class="user-section">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
            <mat-icon>account_circle</mat-icon>
            <span class="user-name">{{ user?.nom ? (user.nom + ' ' + (user.prenom || '')) : 'Utilisateur' }}</span>
            <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before" class="user-menu">
            <div class="menu-user-info">
                <p class="menu-user-name">{{ user?.nom }} {{ user?.prenom }}</p>
                <p class="menu-user-role">Agent connecté</p>
            </div>
            <button mat-menu-item (click)="onLogout()">
                <mat-icon color="warn">exit_to_app</mat-icon>
                <span>Se déconnecter</span>
            </button>
        </mat-menu>
    </div>
</mat-toolbar>
